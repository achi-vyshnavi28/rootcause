name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -pci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ROOTCAUSE_MYSQL_URL: mysql+pymysql://root:ci@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # PatchCore tests need torch; the CPU build (not in requirements.txt: it comes from PyTorch's own index)
      - run: pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      # Compile the C extension so its test (C result == numpy result) runs instead of being skipped.
      - name: Build C NMS library
        run: gcc -O3 -shared -fPIC -o vision/libnms.so vision/nms.c
      # Unit + end-to-end agent tests use in-memory DuckDB with a scripted LLM, and the Django
      # tests use SQLite with eager Celery: no database server, no API key, no cost.
      - run: python -m pytest -q
      - name: Benchmark C vs numpy NMS
        run: python -m vision.nms

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
