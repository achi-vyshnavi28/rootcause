name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Unit + end-to-end agent tests run on an in-memory DuckDB copy with a scripted LLM:
      # no database, no API key, no cost.
      - run: python -m pytest -q
