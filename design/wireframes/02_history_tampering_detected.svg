<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>02 History: tampering detected (v1.2, built)</title><rect width="1280" height="800" fill="#ffffff"/><rect width="300" height="800" fill="#f0f2f6"/><text x="330" y="70" fill="#1c2330" font-size="34" font-weight="700" text-anchor="start" font-family="Inter, Arial">RootCause</text><text x="330" y="98" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Ask why a metric changed. Every number links to the SQL that produced it.</text><text x="330" y="135" fill="#1c2330" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, Arial">Ask</text><text x="380" y="135" fill="#1c2330" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, Arial">History</text><text x="455" y="135" fill="#1c2330" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, Arial">Evals</text><text x="24" y="60" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Dataset</text><rect x="24" y="70" width="250" height="36" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="93" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Olist lab (planted anomalies)</text><rect x="24" y="140" width="250" height="48" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="169" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Why did orders drop in April 2018?</text><rect x="24" y="200" width="250" height="48" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="229" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Why did revenue jump in Oct 2017?</text><rect x="380" y="142" width="58" height="3" fill="#ff4b4b"/><line x1="330" y1="146" x2="1250" y2="146" stroke="#d0d5dd"/><rect x="330" y="170" width="920" height="44" rx="6" fill="#fce4e4" stroke="#b42318"/><text x="348" y="198" fill="#b42318" font-size="14" font-weight="600" text-anchor="start" font-family="Inter, Arial">✖ Audit trail problem: 2 issue(s). Stored answers may have been changed outside the app.</text><rect x="330" y="240" width="920" height="104" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="340" y="263" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Entry</text><text x="430" y="263" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Run</text><text x="590" y="263" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Problem</text><line x1="330" y1="276" x2="1250" y2="276" stroke="#d0d5dd"/><text x="340" y="298" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">seq 41</text><text x="430" y="298" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">b5fb73fc…</text><text x="590" y="298" fill="#b42318" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">run or its queries changed after they were recorded</text><line x1="330" y1="310" x2="1250" y2="310" stroke="#d0d5dd"/><text x="340" y="332" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">–</text><text x="430" y="332" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">x-1</text><text x="590" y="332" fill="#b42318" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">run has no audit entry (inserted outside the app?)</text><rect x="330" y="370" width="870" height="138" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="340" y="393" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Time</text><text x="410" y="393" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Question</text><text x="750" y="393" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Dataset</text><text x="850" y="393" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Status</text><text x="930" y="393" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Model</text><text x="1130" y="393" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Seconds</text><line x1="330" y1="406" x2="1200" y2="406" stroke="#d0d5dd"/><text x="340" y="428" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">10:41</text><text x="410" y="428" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Why did orders drop in April?</text><text x="750" y="428" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">olist_lab</text><text x="850" y="428" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">ok</text><text x="930" y="428" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">gemini-3.6-flash</text><text x="1130" y="428" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">21.7</text><line x1="330" y1="440" x2="1200" y2="440" stroke="#d0d5dd"/><text x="340" y="462" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">10:12</text><text x="410" y="462" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">How many orders were canceled?</text><text x="750" y="462" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">olist</text><text x="850" y="462" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">ok</text><text x="930" y="462" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">gemini-3.6-flash</text><text x="1130" y="462" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">14.1</text><line x1="330" y1="474" x2="1200" y2="474" stroke="#d0d5dd"/><text x="340" y="496" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">09:58</text><text x="410" y="496" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Why did revenue jump in October?</text><text x="750" y="496" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">olist_lab</text><text x="850" y="496" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">ok</text><text x="930" y="496" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">gemini-3.6-flash</text><text x="1130" y="496" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">48.2</text><rect x="950" y="520" width="300" height="86" rx="6" fill="#fffbe6" stroke="#f5c542"/><text x="962" y="542" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Names the exact run and what changed,</text><text x="962" y="562" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">so QA can open an investigation.</text><text x="962" y="582" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Tested: 7 tamper scenarios.</text></svg>