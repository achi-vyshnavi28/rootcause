<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><title>04 RC-126 Monthly audit-trail review (v1.3 proposal)</title><rect width="1280" height="800" fill="#ffffff"/><rect width="300" height="800" fill="#f0f2f6"/><text x="330" y="70" fill="#1c2330" font-size="34" font-weight="700" text-anchor="start" font-family="Inter, Arial">RootCause</text><text x="330" y="98" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Ask why a metric changed. Every number links to the SQL that produced it.</text><text x="330" y="135" fill="#1c2330" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, Arial">Ask</text><text x="380" y="135" fill="#1c2330" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, Arial">History</text><text x="455" y="135" fill="#1c2330" font-size="14" font-weight="400" text-anchor="start" font-family="Inter, Arial">Evals</text><text x="1256" y="32" fill="#6b7280" font-size="13" font-weight="400" text-anchor="end" font-family="Inter, Arial">Signed in: Arjun Rao · QA manager · Log out</text><text x="24" y="60" fill="#6b7280" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Dataset</text><rect x="24" y="70" width="250" height="36" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="93" fill="#1c2330" font-size="13" font-weight="400" text-anchor="start" font-family="Inter, Arial">Olist lab (planted anomalies)</text><rect x="24" y="140" width="250" height="48" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="36" y="169" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Why did the deviation rate rise in June?</text><rect x="380" y="142" width="58" height="3" fill="#ff4b4b"/><line x1="330" y1="146" x2="1250" y2="146" stroke="#d0d5dd"/><text x="330" y="190" fill="#1c2330" font-size="22" font-weight="700" text-anchor="start" font-family="Inter, Arial">Audit-trail review: September 2026</text><rect x="330" y="210" width="920" height="240" rx="8" fill="#fff" stroke="#d0d5dd"/><text x="340" y="233" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Check</text><text x="660" y="233" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" font-family="Inter, Arial">Result</text><line x1="330" y1="246" x2="1250" y2="246" stroke="#d0d5dd"/><text x="340" y="268" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Entries verified</text><text x="660" y="268" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">212</text><line x1="330" y1="280" x2="1250" y2="280" stroke="#d0d5dd"/><text x="340" y="302" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Chain intact</text><text x="660" y="302" fill="#1a7f4b" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Yes</text><line x1="330" y1="314" x2="1250" y2="314" stroke="#d0d5dd"/><text x="340" y="336" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Runs changed after recording</text><text x="660" y="336" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">0</text><line x1="330" y1="348" x2="1250" y2="348" stroke="#d0d5dd"/><text x="340" y="370" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Runs without an audit entry</text><text x="660" y="370" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">0</text><line x1="330" y1="382" x2="1250" y2="382" stroke="#d0d5dd"/><text x="340" y="404" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Models used</text><text x="660" y="404" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">gemini-3.6-flash (212)</text><line x1="330" y1="416" x2="1250" y2="416" stroke="#d0d5dd"/><text x="340" y="438" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Generated</text><text x="660" y="438" fill="#1c2330" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">2026-10-01 06:00 UTC (scheduled)</text><rect x="330" y="480" width="116" height="36" rx="6" fill="#ff4b4b" stroke="#ff4b4b"/><text x="388.0" y="503" fill="#fff" font-size="14" font-weight="600" text-anchor="middle" font-family="Inter, Arial">Download PDF</text><rect x="480" y="480" width="108" height="36" rx="6" fill="#fff" stroke="#d0d5dd"/><text x="534.0" y="503" fill="#1c2330" font-size="14" font-weight="600" text-anchor="middle" font-family="Inter, Arial">File in QMS</text><rect x="950" y="530" width="300" height="86" rx="6" fill="#fffbe6" stroke="#f5c542"/><text x="962" y="552" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">G3: evidence for the periodic review</text><text x="962" y="572" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">our procedures require.</text><text x="962" y="592" fill="#7a5c00" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, Arial">Problem found → owner emailed ≤ 15 min.</text></svg>